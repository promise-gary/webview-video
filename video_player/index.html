<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动态资源视频播放器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="player">
      <canvas id="video-canvas" aria-label="透明视频画面">
        当前环境不支持 Canvas。
      </canvas>

      <div id="debug-layer" class="debug-layer" hidden>
        <aside id="player-debug-panel" class="player-debug-panel" hidden>
          <div id="debug-info" class="debug-info">正在读取视频信息…</div>
          <div class="cache-info">
            <span>缓存</span>
            <span id="cache-detail">等待下载…</span>
          </div>
          <progress id="cache-progress" max="100" value="0">0%</progress>
        </aside>
      </div>
    </main>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
