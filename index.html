<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动态资源视频播放器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="player">
      <canvas id="video-canvas" width="1" height="1" aria-label="透明视频画面">
        当前环境不支持 Canvas。
      </canvas>

      <div id="debug-layer" class="debug-layer" hidden>
        <aside id="player-debug-panel" class="player-debug-panel" hidden>
          <div id="debug-info" class="debug-info">等待宿主应用传入完整媒体…</div>
        </aside>
      </div>
    </main>

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
