server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 播放器入口和所有静态资源都从同一目录读取。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件需要及时获取新版本，避免 WebView 长时间使用旧资源引用。
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    # 明确声明模块脚本类型，确保 WebView 能正确加载 ES Module。
    location ~* \.(js|mjs)$ {
        try_files $uri =404;
        default_type application/javascript;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.css$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }
}
